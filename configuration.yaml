###################################################
#     Home Assistant Main Configuration File      #
###################################################
homeassistant:
  customize: !include customize.yaml
  # https://home-assistant.io/docs/configuration/packages/
  packages: !include_dir_named packages
  # Allow access to config dir, in order to have a sensor to monitor DB size.
  allowlist_external_dirs:
    - !secret allow_dir

# Include Files
automation: !include automations.yaml
group: !include groups.yaml
input_boolean: !include input_booleans.yaml
light: !include lights.yaml
scene: !include scenes.yaml
script: !include scripts.yaml

####################################################
#            Home Assistant Components             #
####################################################
# https://www.home-assistant.io/integrations/api/
api:
# https://www.home-assistant.io/integrations/default_config/
default_config:
# https://www.home-assistant.io/integrations/history
history:

# https://www.home-assistant.io/components/logbook/
logbook:
  include:
    domains:
      - automation
      - script
# https://www.home-assistant.io/components/logger/
logger:
  default: warning
  # logs:
    # homeassistant.core: debug
    # homeassistant.components.recorder.core: debug
    # RFXtrx: debug
# https://www.home-assistant.io/docs/ecosystem/ios/
ios:
# https://www.home-assistant.io/components/recorder/
recorder:
  purge_keep_days: 10
  auto_purge: true
  auto_repack: true
  exclude:
    # High-frequency diagnostic readings are retained in InfluxDB where needed.
    entity_globs:
      - sensor.*_current
      - sensor.*_current_consumption
      - sensor.*_voltage
    entities:
      - sensor.conservatory_total_power_now
      - sensor.ironing_room_total_power_now
      - sensor.kitchen_total_power_now
      - sensor.loft_total_power_now
      - sensor.owl_electricity_power
      - sensor.owl_energy_now

# https://www.home-assistant.io/components/sun/
sun:
            
##################################################
#                   Templates                    #
##################################################
template:
- sensor:
  - default_entity_id: sensor.sun_template
    unique_id: sun_template
    icon: '{% if is_state(''sun.sun'', ''above_horizon'') %}mdi:weather-sunny{% else %}mdi:weather-night{% endif %}'
    name: Sun
    availability: >
      {{ state_attr('sun.sun', 'next_rising') is not none and
         state_attr('sun.sun', 'next_setting') is not none }}
    state: >
      {{ as_timestamp(state_attr('sun.sun', 'next_rising'))
         | timestamp_custom('%H:%M', true) }} •
      {{ as_timestamp(state_attr('sun.sun', 'next_setting'))
         | timestamp_custom('%H:%M', true) }}
