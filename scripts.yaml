morgan_away:
  alias: Morgan away
  sequence:
  - action: homeassistant.turn_off
    entity_id:
    - light.morgans_lights
fraser_away:
  alias: Fraser away
  sequence:
  - action: homeassistant.turn_off
    entity_id:
    - light.frasers_lights
everyone_away:
  alias: everyone_away
  sequence:
  - action: homeassistant.turn_off
    entity_id:
    - script.morgan_away
    - script.fraser_away
    - group.conservatory_lights
    - group.dining_room_lights
    - group.living_room_lights
sonos_say:
  alias: Sonos TTS script
  sequence:
  - action: sonos.snapshot
    data:
      entity_id: '{{ sonos_entity }}'
  - action: media_player.unjoin
    data:
      entity_id: '{{ sonos_entity }}'
  - action: media_player.volume_set
    data:
      entity_id: '{{ sonos_entity }}'
      volume_level: '{{ volume }}'
  - action: tts.google_translate_say
    data:
      entity_id: '{{ sonos_entity }}'
      message: '{{ message }}'
  - delay: '{{ delay }}'
  - action: sonos.restore
    data:
      entity_id: '{{ sonos_entity }}'
