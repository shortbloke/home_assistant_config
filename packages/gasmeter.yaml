         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_weekly.state | float(0) * states.input_number.energy_gas_unit.state
      | float(0))  + (states.input_number.energy_gas_standing.state | float(0) * 7 )) /100)
      | round(2) }}'
    name: gas_price_week
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_week_last
