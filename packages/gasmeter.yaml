    state: '{{ (((states.sensor.utility_meter_gas_weekly.attributes.last_period |
      float * states.input_number.energy_gas_unit.state | float(0)) + (states.input_number.energy_gas_standing.state
      | float(0) * 7 )) /100) | round(2) }}'
    name: gas_price_week_last
- sensor:
  - default_entity_id: sensor.gas_price_week_display
    unique_id: gas_price_week_display
    availability: "{{ has_value('sensor.gas_price_week') }}"
    state: £{{ states.sensor.gas_price_week.state }}
    name: gas_price_week_display
- sensor:
  - default_entity_id: sensor.gas_price_week_last_display
    unique_id: gas_price_week_last_display
    availability: "{{ has_value('sensor.gas_price_week_last') }}"
    state: £{{ states.sensor.gas_price_week_last.state }}
    name: gas_price_week_last_display
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_month
    unique_id: gas_price_month
    availability: >
      {{ has_value('sensor.utility_meter_gas_monthly') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_monthly.state | float(0) * states.input_number.energy_gas_unit.state
      | float(0))  + (states.input_number.energy_gas_standing.state | float(0) * 28 )) /100)
      | round(2) }}'
    name: gas_price_month
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_month_last
    unique_id: gas_price_month_last
    availability: >
      {{ state_attr('sensor.utility_meter_gas_monthly', 'last_period') is number and
