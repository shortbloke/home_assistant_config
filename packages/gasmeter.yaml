input_number:  # Inputs used to allow values to be updated in UI. 
  energy_gas_unit:  # Unit of energy cost.
    name: Gas unit price (p/kwh)
    min: 0
    max: 999999
    step: 0.0001
    unit_of_measurement: p
    mode: box
  energy_gas_standing:  # Daily standing charge regardless of usage.
    name: Gas daily standing charge
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: p
    mode: box
  gas_meter_reading:  # Current meter reading, allowing value to be corrected as needed.
    name: Gas Meter Reading
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: m/3
    # unit_of_measurement: ft/3 - adjust as needed depending on meter type
    mode: box

utility_meter:  # Sensors to create hourly, daily, weekly and yearly incrementing counters for usage.
  utility_meter_gas_hourly:
    source: sensor.gas_meter_kwh
    cycle: hourly
  utility_meter_gas_daily:
    source: sensor.gas_meter_kwh
    cycle: daily  
  utility_meter_gas_weekly:
    source: sensor.gas_meter_kwh
    cycle: weekly
  utility_meter_gas_monthly:
    source: sensor.gas_meter_kwh
    cycle: monthly
  utility_meter_gas_yearly:
    source: sensor.gas_meter_kwh
    cycle: yearly
  utility_meter_gas_cost_daily:
    source: sensor.gas_price_day
    cycle: daily

automation:  # Automation used to react to changes in state from a magnetic sensor attached to the gas meter.
  id: energy_gas_pulse_received
  alias: Energy - Gas - Pulse Received
  triggers:
    - trigger: state
      entity_id: binary_sensor.gas_meter_sensor_on_off
      to: 'off'
  conditions: []
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_meter_reading
      data:
        value: "{{ states('input_number.gas_meter_reading') | float(0) + 0.010 }}"
  mode: queued
  max: 100

template:
- sensor:  # Template sensor to create sensor type needed for Energy Dashboard
  - name: "Gas Meter Total"
    default_entity_id: sensor.gas_meter_total
    unique_id: gas_meter_total
    unit_of_measurement: "m³"
    # unit_of_measurement: "ft³"
    state_class: "total_increasing"
    device_class: "gas"
    availability: "{{ has_value('input_number.gas_meter_reading') }}"
    state: "{{ (states.input_number.gas_meter_reading.state | float(0) ) }}"
- sensor:
  - unit_of_measurement: GBP/m³
    default_entity_id: sensor.gas_meter_price_m3
    unique_id: gas_meter_price_m3
    availability: "{{ has_value('input_number.energy_gas_unit') }}"
    state: '{{ (states.input_number.energy_gas_unit.state | float(0) * 1.02264 * 39.4
      / 3.6/ 100) | round(4)}}'
    name: gas_meter_price_m3
- sensor:
  - unit_of_measurement: kWh
    default_entity_id: sensor.gas_meter_kwh
    unique_id: gas_meter_kwh
    availability: "{{ has_value('input_number.gas_meter_reading') }}"
    state: '{{ (states.input_number.gas_meter_reading.state | float(0) * 1.02264 * 39.4
      / 3.6) | round(2)}}'
    name: gas_meter_kwh
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_hour
    unique_id: gas_price_hour
    availability: >
      {{ has_value('sensor.utility_meter_gas_hourly') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_hourly.state | float(0) * states.input_number.energy_gas_unit.state
      | float(0))  + (states.input_number.energy_gas_standing.state | float(0) /24)) /100)
      | round(2) }}'
    name: gas_price_hour
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_hour_last
    unique_id: gas_price_hour_last
    availability: >
      {{ state_attr('sensor.utility_meter_gas_hourly', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_hourly.attributes.last_period |
      float * states.input_number.energy_gas_unit.state | float(0)) + (states.input_number.energy_gas_standing.state
      | float(0) /24 )) /100) | round(2) }}'
    name: gas_price_hour_last
- sensor:
  - default_entity_id: sensor.gas_price_hour_display
    unique_id: gas_price_hour_display
    availability: "{{ has_value('sensor.gas_price_hour') }}"
    state: £{{ states.sensor.gas_price_hour.state }}
    name: gas_price_hour_display
- sensor:
  - default_entity_id: sensor.gas_price_hour_last_display
    unique_id: gas_price_hour_last_display
    availability: "{{ has_value('sensor.gas_price_hour_last') }}"
    state: £{{ states.sensor.gas_price_hour_last.state }}
    name: gas_price_hour_last_display
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_day
    unique_id: gas_price_day
    availability: >
      {{ has_value('sensor.utility_meter_gas_daily') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_daily.state | float(0) * states.input_number.energy_gas_unit.state
      | float(0))  + (states.input_number.energy_gas_standing.state | float(0) )) /100)
      | round(2) }}'
    name: gas_price_day
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_day_last
    unique_id: gas_price_day_last
    availability: >
      {{ state_attr('sensor.utility_meter_gas_daily', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: '{{ (((states.sensor.utility_meter_gas_daily.attributes.last_period | float(0)
      * states.input_number.energy_gas_unit.state | float(0)) + (states.input_number.energy_gas_standing.state
      | float(0) )) /100) | round(2) }}'
    name: gas_price_day_last
- sensor:
  - default_entity_id: sensor.gas_price_day_display
    unique_id: gas_price_day_display
    availability: "{{ has_value('sensor.gas_price_day') }}"
    state: £{{ states.sensor.gas_price_day.state }}
    name: gas_price_day_display
- sensor:
  - default_entity_id: sensor.gas_price_day_last_display
    unique_id: gas_price_day_last_display
    availability: "{{ has_value('sensor.gas_price_day_last') }}"
    state: £{{ states.sensor.gas_price_day_last.state }}
    name: gas_price_day_last_display
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_week
    unique_id: gas_price_week
    availability: >
      {{ has_value('sensor.utility_meter_gas_weekly') and
