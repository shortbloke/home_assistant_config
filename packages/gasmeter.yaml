input_number:  # Inputs used to allow values to be updated in UI.
  gas_meter_reading:  # Current meter reading, allowing value to be corrected as needed.
    name: Gas Meter Reading
    min: 0
    max: 999999
    step: 0.001
    unit_of_measurement: m³
    # unit_of_measurement: ft³ - adjust as needed depending on meter type
    mode: box

utility_meter:  # Sensors to create hourly, daily, weekly and yearly incrementing counters for usage.
  utility_meter_gas_hourly:
    source: sensor.gas_meter_kwh
    cycle: hourly
    unique_id: utility_meter_gas_hourly
  utility_meter_gas_daily:
    source: sensor.gas_meter_kwh
    cycle: daily
    unique_id: utility_meter_gas_daily
  utility_meter_gas_weekly:
    source: sensor.gas_meter_kwh
    cycle: weekly
    unique_id: utility_meter_gas_weekly
  utility_meter_gas_monthly:
    source: sensor.gas_meter_kwh
    cycle: monthly
    unique_id: utility_meter_gas_monthly
  utility_meter_gas_yearly:
    source: sensor.gas_meter_kwh
    cycle: yearly
    unique_id: utility_meter_gas_yearly
  utility_meter_gas_cost_daily:
    source: sensor.gas_price_day
    cycle: daily
    unique_id: utility_meter_gas_cost_daily

automation:  # Automation used to react to changes in state from a magnetic sensor attached to the gas meter.
  id: energy_gas_pulse_received
  alias: Energy - Gas - Pulse Received
  triggers:
    - trigger: state
      entity_id: binary_sensor.gas_meter_sensor_on_off
      to: 'off'
  conditions: []
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.gas_meter_reading
      data:
        value: "{{ states('input_number.gas_meter_reading') | float(0) + 0.010 }}"
  mode: queued
  max: 100

template:
- sensor:  # Template sensor to create sensor type needed for Energy Dashboard
  - name: "Gas Meter Total"
    default_entity_id: sensor.gas_meter_total
    unique_id: gas_meter_total
    unit_of_measurement: "m³"
    # unit_of_measurement: "ft³"
    state_class: "total_increasing"
    device_class: "gas"
    availability: "{{ has_value('input_number.gas_meter_reading') }}"
    state: "{{ states('input_number.gas_meter_reading') | float(0) }}"
- sensor:
  - unit_of_measurement: GBP/m³
    default_entity_id: sensor.gas_meter_price_m3
    unique_id: gas_meter_price_m3
    availability: "{{ has_value('input_number.energy_gas_unit') }}"
    state: >
      {{ (
        states('input_number.energy_gas_unit') | float(0)
        * 1.02264 * 39.4 / 3.6 / 100
      ) | round(4) }}
    name: Gas Unit Price per Cubic Metre
- sensor:
  - unit_of_measurement: kWh
    default_entity_id: sensor.gas_meter_kwh
    unique_id: gas_meter_kwh
    device_class: energy
    state_class: total_increasing
    availability: "{{ has_value('input_number.gas_meter_reading') }}"
    state: >
      {{ (
        states('input_number.gas_meter_reading') | float(0)
        * 1.02264 * 39.4 / 3.6
      ) | round(2) }}
    name: Gas Meter Energy
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_hour
    unique_id: gas_price_hour
    device_class: monetary
    state_class: total
    availability: >
      {{ has_value('sensor.utility_meter_gas_hourly') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        states('sensor.utility_meter_gas_hourly') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0) / 24
      ) / 100) | round(4) }}
    name: Gas Cost This Hour
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_hour_last
    unique_id: gas_price_hour_last
    device_class: monetary
    state_class: total
    availability: >
      {{ state_attr('sensor.utility_meter_gas_hourly', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        state_attr('sensor.utility_meter_gas_hourly', 'last_period') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0) / 24
      ) / 100) | round(4) }}
    name: Gas Cost Last Hour
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_day
    unique_id: gas_price_day
    device_class: monetary
    state_class: total
    availability: >
      {{ has_value('sensor.utility_meter_gas_daily') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        states('sensor.utility_meter_gas_daily') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0)
      ) / 100) | round(4) }}
    name: Gas Cost Today
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_day_last
    unique_id: gas_price_day_last
    device_class: monetary
    state_class: total
    availability: >
      {{ state_attr('sensor.utility_meter_gas_daily', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        state_attr('sensor.utility_meter_gas_daily', 'last_period') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0)
      ) / 100) | round(4) }}
    name: Gas Cost Yesterday
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_week
    unique_id: gas_price_week
    device_class: monetary
    state_class: total
    availability: >
      {{ has_value('sensor.utility_meter_gas_weekly') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        states('sensor.utility_meter_gas_weekly') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0) * 7
      ) / 100) | round(4) }}
    name: Gas Cost This Week
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_week_last
    unique_id: gas_price_week_last
    device_class: monetary
    state_class: total
    availability: >
      {{ state_attr('sensor.utility_meter_gas_weekly', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        state_attr('sensor.utility_meter_gas_weekly', 'last_period') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0) * 7
      ) / 100) | round(4) }}
    name: Gas Cost Last Week
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_month
    unique_id: gas_price_month
    device_class: monetary
    state_class: total
    availability: >
      {{ has_value('sensor.utility_meter_gas_monthly') and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        states('sensor.utility_meter_gas_monthly') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0) * now().day
      ) / 100) | round(4) }}
    name: Gas Cost This Month
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.gas_price_month_last
    unique_id: gas_price_month_last
    device_class: monetary
    state_class: total
    availability: >
      {{ state_attr('sensor.utility_meter_gas_monthly', 'last_period') is number and
         has_value('input_number.energy_gas_unit') and
         has_value('input_number.energy_gas_standing') }}
    state: >
      {{ ((
        state_attr('sensor.utility_meter_gas_monthly', 'last_period') | float(0)
        * states('input_number.energy_gas_unit') | float(0)
        + states('input_number.energy_gas_standing') | float(0)
          * (now().replace(day=1) - timedelta(days=1)).day
      ) / 100) | round(4) }}
    name: Gas Cost Last Month
