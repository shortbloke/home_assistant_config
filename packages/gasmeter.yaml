    state: '{{ (((states.sensor.utility_meter_gas_monthly.attributes.last_period |
      float * states.input_number.energy_gas_unit.state | float(0)) + (states.input_number.energy_gas_standing.state
      | float(0) * 28 )) /100) | round(2) }}'
    name: gas_price_month_last
- sensor:
  - default_entity_id: sensor.gas_price_month_display
    unique_id: gas_price_month_display
    availability: "{{ has_value('sensor.gas_price_month') }}"
    state: £{{ states.sensor.gas_price_month.state }}
