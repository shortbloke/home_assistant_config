##################################################
## Components/Sensors
##################################################
input_select:
  tesla_charging_status:
    name: Tesla Charging Status
    options:
      - idle
      - charging
      - finished
    icon: mdi:car-electric

template:
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.tesla_charging_cost_today
    unique_id: tesla_charging_cost_today
    device_class: monetary
    state_class: total
    icon: mdi:currency-gbp
    name: Tesla Charging Cost Today
    availability: >
      {{ has_value('sensor.electricity_unit_price') and
         has_value('sensor.tesla_charger_today_s_consumption') }}
    state: >
      {{ (
        states('sensor.electricity_unit_price') | float(0) *
        states('sensor.tesla_charger_today_s_consumption') | float(0)
      ) | round(4) }}
- sensor:
  - unit_of_measurement: GBP
    default_entity_id: sensor.tesla_charging_cost_this_month
    unique_id: tesla_changing_cost_this_month
    device_class: monetary
    state_class: total
    icon: mdi:currency-gbp
    name: Tesla Charging Cost This Month
    availability: >
      {{ has_value('sensor.electricity_unit_price') and
         has_value('sensor.tesla_charger_this_month_s_consumption') }}
    state: >
      {{ (
        states('sensor.electricity_unit_price') | float(0) *
        states('sensor.tesla_charger_this_month_s_consumption') | float(0)
      ) | round(4) }}
