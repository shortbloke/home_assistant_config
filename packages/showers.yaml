template:
  - binary_sensor:
      - delay_on: 0:00:20
        delay_off: 0:00:20
        default_entity_id: binary_sensor.ensuite_shower_active
        unique_id: ensuite_shower_active
        name: Ensuite Shower Active
        availability: "{{ has_value('sensor.ensuite_shower_energy_power') }}"
        state: "{{ states('sensor.ensuite_shower_energy_power') | float(0) > 4 }}"
  - binary_sensor:
      - delay_on: 0:00:20
        delay_off: 0:00:20
        default_entity_id: binary_sensor.family_bathroom_shower_active
        unique_id: family_bathroom_shower_active
        name: Family Bathroom Shower Active
        availability: "{{ has_value('sensor.family_bathroom_shower_energy_power') }}"
        state: "{{ states('sensor.family_bathroom_shower_energy_power') | float(0) > 4 }}"

sensor:
  - platform: history_stats
    name: Ensuite Shower Uses Today
    unique_id: ensuite_shower_uses_today
    state_class: total_increasing
    entity_id: binary_sensor.ensuite_shower_active
    type: count
    state: "on"
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Family Bathroom Shower Uses Today
    unique_id: family_bathroom_shower_uses_today
    state_class: total_increasing
    entity_id: binary_sensor.family_bathroom_shower_active
    type: count
    state: "on"
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Ensuite Shower Time Today
    unique_id: ensuite_shower_time_today
    state_class: total_increasing
    entity_id: binary_sensor.ensuite_shower_active
    type: time
    state: "on"
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Family Bathroom Shower Time Today
    unique_id: family_bathroom_shower_time_today
    state_class: total_increasing
    entity_id: binary_sensor.family_bathroom_shower_active
    type: time
    state: "on"
    start: "{{ today_at() }}"
    end: "{{ now() }}"

homeassistant:
  customize:
    sensor.ensuite_shower_uses_today:
      icon: mdi:counter
    sensor.family_bathroom_shower_uses_today:
      icon: mdi:counter
    sensor.ensuite_shower_time_today:
      icon: mdi:clock-outline
    sensor.family_bathroom_shower_time_today:
      icon: mdi:clock-outline
