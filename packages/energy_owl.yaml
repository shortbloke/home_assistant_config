####################################################
# Owl Intuition - Energy Sensor                     #
####################################################

input_boolean:
  owl_electricity_watchdog_alerted:
    name: Owl Electricity Watchdog Alerted
    icon: mdi:alert

template:
  - triggers:
      - trigger: state
        entity_id:
          - sensor.owl_electricity_power
          - sensor.owl_solar_generating
          - sensor.owl_solar_exporting
    sensor:
      - name: "Owl Energy Now"
        unique_id: owl_energy_now
        default_entity_id: sensor.owl_energy_now
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        availability: >
          {{ has_value('sensor.owl_electricity_power') and
             has_value('sensor.owl_solar_generating') and
             has_value('sensor.owl_solar_exporting') }}
        state: >
          {% set electricity = states('sensor.owl_electricity_power') | float(0) %}
          {% set solar = states('sensor.owl_solar_generating') | float(0) %}
          {% set exported = states('sensor.owl_solar_exporting') | float(0) %}
          {{ [electricity - (solar - exported), 0] | max | round(1) }}

  - triggers:
      - trigger: state
        entity_id:
          - sensor.owl_electricity_today
          - sensor.owl_solar_generated_today
          - sensor.owl_solar_exported_today
    sensor:
      - name: "Owl Energy Today"
        unique_id: owl_energy_today
        default_entity_id: sensor.owl_energy_today
        unit_of_measurement: "kWh"
        state_class: total
        device_class: energy
        availability: >
          {{ has_value('sensor.owl_electricity_today') and
             has_value('sensor.owl_solar_generated_today') and
             has_value('sensor.owl_solar_exported_today') }}
        state: >
          {% set electricity = states('sensor.owl_electricity_today') | float(0) %}
          {% set solar = states('sensor.owl_solar_generated_today') | float(0) %}
          {% set exported = states('sensor.owl_solar_exported_today') | float(0) %}
          {% set calculated = electricity - (solar - exported) %}
          {{ [calculated, 0] | max | round(3) }}
